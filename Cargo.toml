[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["third_party"]

[workspace.package]
version = "0.14.0"
edition = "2024"
license = "MIT"
authors = ["beiacox"]
repository = "https://github.com/beiacox/neontop"

[workspace.dependencies]
neontop-core = { path = "crates/neontop-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
libc = { version = "0.2.189", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Las librerías de la capa de FPS son `no_std` (se cargan dentro de los juegos): sin std no hay
# desenrollado, así que también en desarrollo un pánico aborta.
[profile.dev]
panic = "abort"

# GPUI compila mucho código: en desarrollo las dependencias van optimizadas para que la interfaz
# no vaya a tirones, y el crate propio en debug para compilar rápido.
[profile.dev.package."*"]
opt-level = 2

# GPUI con un parche para seguir en la bandeja al cerrar la ventana (ver third_party/gpui/NEONTOP.md)
[patch.crates-io]
gpui = { path = "third_party/gpui" }
